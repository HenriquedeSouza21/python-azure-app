<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{{ "Editar" if tarefa else "Nova" }} Tarefa</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input[type=text], textarea { width: 100%; padding: 6px; margin-top: 4px; }
        button { margin-top: 16px; padding: 8px 16px; background: #1a73e8; color: white; border: none; border-radius: 4px; cursor: pointer; }
        a { display: block; margin-top: 12px; color: #666; }
    </style>
</head>
<body>
    <h1>{{ "Editar" if tarefa else "Nova" }} Tarefa</h1>
    <form method="POST">
        <label>Título</label>
        <input type="text" name="titulo" value="{{ tarefa.titulo if tarefa else '' }}" required>

        <label>Descrição</label>
        <textarea name="descricao" rows="3">{{ tarefa.descricao if tarefa else '' }}</textarea>

        {% if tarefa %}
        <label>
            <input type="checkbox" name="concluida" {{ "checked" if tarefa.concluida else "" }}>
            Concluída
        </label>
        {% endif %}

        <button type="submit">Salvar</button>
    </form>
    <a href="{{ url_for('index') }}">← Voltar</a>
</body>
</html>
